<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CredCheck</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>

  <nav class="navbar">
    <div class="logo">CredCheck</div>
    <ul class="nav-links">
      <li><a href="#" onclick="showPage('predictor')">Predictor</a></li>
      <li><a href="#" onclick="showPage('eda')">Exploration</a></li>
      <li><a href="#" onclick="showPage('visualizer')">Analytics</a></li>
    </ul>
  </nav>

  <main class="container">
    <section id="predictor" class="page active">
      <h1>Loan Default Prediction</h1>
      <p>Enter client data to assess risk using our trained model.</p>

      <form id="prediction-form">
        <div class="form-grid">
          <fieldset>
            <legend>Profile & Demographics</legend>
            <div class="input-group">
              <label>Credit Limit (NT$)</label>
              <input name="LIMIT_BAL" type="number" value="20000" required>
            </div>
            <div class="input-group">
              <label>Age</label>
              <input name="AGE" type="number" value="30" required>
            </div>
            <div class="input-group">
              <label>Education (1-4)</label>
              <select name="EDUCATION">
                <option value="1">Grad School</option>
                <option value="2">University</option>
                <option value="3">High School</option>
                <option value="4">Others</option>
              </select>
            </div>
          </fieldset>

          <fieldset>
            <legend>Recent Repayment Status</legend>
            <div class="input-row">
              <label>
                Sept
                <span class="tooltip-container">
                  <span class="info-icon">ⓘ</span>
                  <div class="tooltip-text">
                    <strong>Repayment Codes:</strong><br>
                    -1 = Paid on time<br>
                    0 = Revolving credit<br>
                    1 = 1 month delay<br>
                    2 = 2 months delay
                  </div>
                </span>
                <input name="PAY_0" type="number" value="0">
              </label>

              <label>
                Jan 2026
                <span class="tooltip-container">
                  <span class="info-icon">ⓘ</span>
                  <div class="tooltip-text">
                    <strong>Repayment Codes:</strong><br>
                    -1 = Paid on time<br>
                    0 = Revolving credit<br>
                    1 = 1 month delay
                  </div>
                </span>
                <input name="PAY_2" type="number" value="0">
              </label>

              <label>
                Dec 2025
                <span class="tooltip-container">
                  <span class="info-icon">ⓘ</span>
                  <div class="tooltip-text">
                    <strong>Repayment Codes:</strong><br>
                    -1 = Paid on time<br>
                    0 = Revolving credit<br>
                    1 = 1 month delay<br>
                    2 = 2 months delay
                  </div>
                </span>
                <input name="PAY_3" type="number" value="0">
              </label>
            </div>
          </fieldset>
        </div>

        <button type="submit" class="btn-predict">Analyze Risk</button>
      </form>
      <div id="result-container" class="hidden">
        <h2>Result: <span id="prediction-output">--</span></h2>
      </div>
    </section>

    <section id="eda" class="page">
      <h1>Explore Data Insights</h1>
    </section>

    <section id="process" class="page">
      <h1>Behind the Prediction</h1>
    </section>

    <section id="visualizer" class="page">
      <h1>Dynamic Charts</h1>
    </section>
  </main>

  <script src="app.js"></script>
</body>

</html>
