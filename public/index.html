<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CredCheck</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="data-explorer.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="site-name">CredCheck</a>
    <ul class="nav-links">
      <li><a href="index.html">Predict Risk</a></li>
      <li><a href="process.html">Behind the Model</a></li>
      <li><a href="visualizer.html">Explore</a></li>
      <li><a href="data-explorer.html">About the Data</a></li>
      <li><a href="eda.html">EDA</a></li>
    </ul>
  </nav>
  <main class="container">
    <section id="predictor" class="page active">
      <h1>Loan Default Prediction</h1>
      <p>Enter client data to assess risk using our trained model.</p>

      <form id="prediction-form">
        <div class="form-grid">
          <fieldset>
            <legend>Profile & Demographics</legend>
            <div class="input-group">
              <label>Credit Limit (CAD$)</label>
              <input name="LIMIT_BAL" type="number" placeholder="e.g. 20000" required>
            </div>

            <div class="input-group">
              <label>Typical Monthly Bill (CAD$)</label>
              <input name="BILL_INPUT" type="number" placeholder="e.g. 1000" required>
            </div>
            <div class="input-group">
              <label>Typical Monthly Payment (CAD$)</label>
              <input name="PAY_INPUT" type="number" placeholder="e.g. 1000" required>
            </div>
            <div class="input-group">
              <label>Age</label>
              <input name="AGE" type="number" placeholder="e.g. 30" required>
            </div>
            <div class="input-group">
              <label>Education level</label>
              <select name="EDUCATION" required>
                <option value="" disabled selected>Select your level</option>
                <option value="1">Grad School</option>
                <option value="2">University</option>
                <option value="3">High School</option>
                <option value="4">Others</option>
              </select>
            </div>
          </fieldset>

          <fieldset>
            <legend>Recent Repayment Status</legend>
            <div class="input-row">
              <label>
                <span id="pay-label-0"></span>
                <span class="tooltip-container">
                  <span class="info-icon">ⓘ</span>
                  <div class="tooltip-text">
                    <strong>What does this mean?</strong><br><br>
                    This describes how payments were handled in recent months.<br><br>

                    <strong>-1</strong>: Paid the full amount on time<br>
                    <strong>0</strong>: Paid on time, but not the full amount<br>
                    <strong>1+</strong>: Payment was late (number = months overdue)
                  </div>
                </span>
                <select name="PAY_0" required>
                  <option value="" disabled selected>Select status</option>
                  <option value="-1">Paid on time (in full)</option>
                  <option value="0">Paid on time (balance remaining)</option>
                  <option value="1">1 month delay</option>
                  <option value="2">2 months delay</option>
                  <option value="3">3 months delay</option>
                  <option value="4">4 months delay</option>
                  <option value="5">5 months delay</option>
                  <option value="6">6 months delay</option>
                  <option value="7">7 months delay</option>
                  <option value="8">8+ months delay</option>
                </select>
              </label>

              <label>
                <span id="pay-label-2"></span>
                <span class="tooltip-container">
                  <span class="info-icon">ⓘ</span>
                  <div class="tooltip-text">
                    <strong>What does this mean?</strong><br><br>
                    This describes how payments were handled in recent months.<br><br>

                    <strong>-1</strong>: Paid the full amount on time<br>
                    <strong>0</strong>: Paid on time, but not the full amount<br>
                    <strong>1+</strong>: Payment was late (number = months overdue)
                  </div>
                </span>
                <select name="PAY_2" required>
                  <option value="" disabled selected>Select status</option>
                  <option value="-1">Paid on time (in full)</option>
                  <option value="0">Paid on time (balance remaining)</option>
                  <option value="2">2 months delay</option>
                  <option value="3">3 months delay</option>
                  <option value="4">4 months delay</option>
                  <option value="5">5 months delay</option>
                  <option value="6">6 months delay</option>
                  <option value="7">7 months delay</option>
                  <option value="8">8+ months delay</option>
                </select>
              </label>

              <label>
                <span id="pay-label-3"></span>
                <span class="tooltip-container">
                  <span class="info-icon">ⓘ</span>
                  <div class="tooltip-text">
                    <strong>What does this mean?</strong><br><br>
                    This describes how payments were handled in recent months.<br><br>

                    <strong>-1</strong>: Paid the full amount on time<br>
                    <strong>0</strong>: Paid on time, but not the full amount<br>
                    <strong>1+</strong>: Payment was late (number = months overdue)
                  </div>
                </span>
                <select name="PAY_3" required>
                  <option value="" disabled selected>Select status</option>
                  <option value="-1">Paid on time (in full)</option>
                  <option value="0">Paid on time (balance remaining)</option>
                  <option value="1">1 month delay</option>
                  <option value="2">2 months delay</option>
                  <option value="3">3 months delay</option>
                  <option value="4">4 months delay</option>
                  <option value="5">5 months delay</option>
                  <option value="6">6 months delay</option>
                  <option value="7">7 months delay</option>
                  <option value="8">8+ months delay</option>
                </select>
              </label>
            </div>
          </fieldset>
        </div>

        <button type="submit" class="btn-predict" id="btn-predict">Analyze Risk</button>
        <div id="loading-indicator" class="hidden">
          Analyzing...
        </div>
      </form>
      <div id="result-container" class="hidden">
        <div class="result-card">
          <p class="result-label">Predicted Default Risk</p>
          <p class="result-value" id="prediction-output">--</p>
          <p class="result-subtext" id="prediction-label"></p>
        </div>
      </div>
    </section>
  </main>
  <script src="visualizer.js"></script>
  <script src="app.js"></script>
</body>

</html>
